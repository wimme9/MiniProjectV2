<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="480"></canvas>

  <button id="muteBtn" class="mute-btn" title="เปิด/ปิดเสียง">🔊</button>

  <!-- ===== TITLE / MENU SCENE ===== -->
  <div id="menu-screen" class="screen">
    <h1 class="game-title">TINY RUNNER</h1>
    <p class="subtitle">หลบสิ่งกีดขวาง เก็บเหรียญ ทำคะแนนให้ได้มากที่สุด!</p>
    <div class="controls-hint">
      <div><span class="key">Space / ↑</span> กระโดด</div>
      <div><span class="key">S / ↓</span> สไลด์</div>
    </div>
    <button id="startBtn" class="btn">START</button>
    <p class="highscore-label">High Score: <span id="menuHighScore">0</span></p>
  </div>

  <!-- ===== MAIN GAMEPLAY HUD ===== -->
  <div id="hud" class="screen hidden">
    <div class="hud-top">
      <div class="hud-score">SCORE: <span id="scoreValue">0</span></div>
      <div class="hud-hp" id="hpDisplay"></div>
    </div>
    <div class="hud-buffs" id="buffDisplay"></div>
  </div>

  <!-- ===== GAME OVER SCENE ===== -->
  <div id="gameover-screen" class="screen hidden">
    <h1 class="game-title">GAME OVER</h1>
    <p class="final-score">คะแนนที่ทำได้: <span id="finalScore">0</span></p>
    <p class="highscore-label">High Score: <span id="finalHighScore">0</span></p>
    <button id="replayBtn" class="btn">REPLAY</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
